<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>SmartVision</title>
<style>
  :root{
    --bg:#000; --panel:#121212; --card:#1c1c1e; --fg:#fff; --muted:#a1a1aa;
    --accent:#FFE600; --accent-fg:#000; --cyan:#00E5FF; --line:#27272a; --danger:#FF334B; --ok:#34d399;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.4 'Atkinson Hyperlegible',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}
  #stage{position:relative;flex:1;min-height:0;background:#000}
  #video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #say{position:absolute;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    background:rgba(0,0,0,.78);font-size:1.3rem;font-weight:600;min-height:3.4rem}
  #panel{background:var(--panel);border-top:1px solid var(--line);
    padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px;align-items:center}
  button,input{font:inherit;border-radius:10px;border:1px solid var(--line);min-height:48px}
  button{background:var(--card);color:var(--fg);padding:0 16px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;flex:1}
  button.danger{border-color:var(--danger);color:var(--danger)}
  input{flex:1;min-width:0;background:#0a0a0a;color:var(--fg);padding:0 12px}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #navStatus,#fps{color:var(--muted);font-size:.9rem}
  #navStatus{min-height:1.3em}
  .spread{justify-content:space-between}
  #stage.flash{box-shadow:inset 0 0 0 8px var(--danger)}
  #alertBtn[aria-pressed="false"]{color:var(--muted)}
  button.big{min-height:76px;font-size:1.3rem;font-weight:700;width:100%}
  button.voice{background:var(--cyan);border-color:var(--cyan);color:#000}
  button.voice[data-state="listening"]{background:var(--accent);border-color:var(--accent)}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1.15rem;letter-spacing:.04em;color:var(--accent)}
  #statusDot{width:12px;height:12px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:8px}
  #statusDot.on{background:var(--ok)}
  #radar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px;background:var(--panel)}
  .zone{background:#18181b;border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;
    font-size:.7rem;font-weight:700;color:var(--muted);min-width:0}
  .zone .zn{text-transform:uppercase;font-size:.6rem;letter-spacing:.04em}
  .zone .zv{margin-top:2px;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ok)}
  .zone.seen{border-color:var(--cyan)} .zone.seen .zv{color:var(--cyan)}
  .zone.yellow{background:var(--accent);border-color:#fff3a0;color:#000} .zone.yellow .zv{color:#000}
  .zone.red{background:var(--danger);border-color:#ffb0ba;color:#000} .zone.red .zv{color:#000}
  #hazard{position:absolute;left:10px;right:10px;top:10px;padding:10px 14px;border-radius:14px;
    background:#300508;border:2px solid var(--danger);z-index:3}
  #hazard[hidden]{display:none}
  #hazard .tag{display:inline-block;background:var(--danger);color:#000;font-weight:900;font-size:.7rem;
    padding:2px 8px;border-radius:6px;letter-spacing:.06em}
  #hazard strong{display:block;font-size:1.35rem;margin-top:4px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,51,75,.7)}70%{box-shadow:0 0 0 14px rgba(255,51,75,0)}100%{box-shadow:0 0 0 0 rgba(255,51,75,0)}}
  #hazard{animation:pulse 1.2s infinite}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two button{min-height:56px;font-weight:700}
  details{border-top:1px solid var(--line);padding-top:8px}
  summary{min-height:44px;display:flex;align-items:center;color:var(--muted);cursor:pointer}
  details .row{margin-top:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <header><h1><span id="statusDot"></span>SMARTVISION</h1><span id="fps" style="color:var(--cyan);font-size:.8rem;font-weight:700"></span></header>
  <div id="radar" aria-hidden="true">
    <div class="zone" id="zFL"><div class="zn">F. Left</div><div class="zv">—</div></div>
    <div class="zone" id="zL"><div class="zn">Left</div><div class="zv">—</div></div>
    <div class="zone" id="zA"><div class="zn">Ahead</div><div class="zv">—</div></div>
    <div class="zone" id="zR"><div class="zn">Right</div><div class="zv">—</div></div>
    <div class="zone" id="zFR"><div class="zn">F. Right</div><div class="zv">—</div></div>
  </div>
  <div id="stage">
    <div id="hazard" role="alert" aria-live="assertive" hidden><span class="tag" id="hazTag">WARNING</span><strong id="hazText"></strong></div>
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="say" aria-live="polite">Tap Start camera to begin.</div>
  </div>
  <div id="panel">
    <button id="startBtn" class="primary big" type="button">Start camera</button>
    <button id="voiceBtn" class="big voice" type="button" aria-label="Where do you want to go? Tap and speak your destination">Where to? Tap and speak</button>
    <div class="two">
      <button id="calBtn" type="button" aria-label="Calibrate distance with a person standing 2 metres away">Calibrate 2 m</button>
      <button id="repeatBtn" type="button" aria-label="Repeat the last message">Repeat</button>
    </div>
    <div id="navStatus" aria-live="polite"></div>
    <details>
      <summary>More options</summary>
      <form id="navForm" class="row">
        <input id="dest" type="text" placeholder="Or type a destination" autocomplete="off" aria-label="Destination">
        <button id="goBtn" type="submit">Go</button>
        <button id="stopNavBtn" type="button" class="danger" hidden>Stop</button>
      </form>
      <div class="row">
        <button id="csvBtn" type="button">Save log (CSV)</button>
        <button id="alertBtn" type="button" aria-pressed="true">Alerts: On</button>
        <button id="langBtn" type="button" aria-label="Voice language" hidden>English</button>
      </div>
      <div class="row"><span id="dbg"></span></div>
    </details>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
// ==== PURE LOGIC START ====
// Same rules as the Python modules: position_analysis.py, text_generation.py, navigation.py
const TH = { leftMax: 0.35, rightMin: 0.65, near: 0.25, medium: 0.06 };

function analyze(pred, W, H, cam) {
  const [x, y, w, h] = pred.bbox;
  const cx = (x + w / 2) / W;
  const horiz = cx < TH.leftMax ? 'left' : (cx > TH.rightMin ? 'right' : 'center');
  const ratio = (w * h) / (W * H);
  const dist = ratio >= TH.near ? 'near' : (ratio >= TH.medium ? 'medium' : 'far');
  const cy = (y + h / 2) / H;
  const a = { label: pred.class, score: pred.score, horiz, dist, ratio, cx, cy, size: Math.sqrt(ratio),
    bbox: pred.bbox, zone: zone5(cx), hN: h / H, bottomN: (y + h) / H,
    truncated: y <= 0.01 * H || (y + h) >= 0.99 * H };
  if (cam) { const f = fuseDist(a, cam); if (f) { a.m = f.m; a.msrc = f.src; a.mok = f.ok; } }
  return a;
}

const TA_LABELS = {
  person: 'மனிதர்', chair: 'நாற்காலி', couch: 'சோபா', bed: 'படுக்கை',
  'dining table': 'மேசை', tv: 'தொலைக்காட்சி', laptop: 'மடிக்கணினி',
  bottle: 'பாட்டில்', cup: 'கோப்பை', car: 'கார்', bicycle: 'சைக்கிள்',
  motorcycle: 'மோட்டார் சைக்கிள்', bus: 'பேருந்து', truck: 'லாரி',
  dog: 'நாய்', cat: 'பூனை', 'cell phone': 'கைபேசி', book: 'புத்தகம்',
  backpack: 'பை', 'potted plant': 'செடி', toilet: 'கழிப்பறை',
  refrigerator: 'குளிர்சாதனப் பெட்டி', clock: 'கடிகாரம்', bench: 'பெஞ்சு',
  'traffic light': 'போக்குவரத்து விளக்கு', 'stop sign': 'நிறுத்த அடையாளம்'
};

const TEXT = {
  en: {
    pos: { left: 'on your left', center: 'ahead', right: 'on your right' },
    dist: { near: 'very close', medium: 'a few steps away', far: 'far away' },
    sentence: (l, p, d) => `${l} ${p}, ${d}`
  },
  ta: {
    pos: { left: 'இடதுபுறம்', center: 'நேரே', right: 'வலதுபுறம்' },
    dist: { near: 'மிக அருகில்', medium: 'சற்று தொலைவில்', far: 'தொலைவில்' },
    sentence: (l, p, d) => `${l} ${p} ${d} உள்ளது`
  }
};

function sentenceFor(a, lang) {
  const label = lang === 'ta' ? (TA_LABELS[a.label] || a.label) : a.label;
  return TEXT[lang].sentence(label, TEXT[lang].pos[a.horiz], TEXT[lang].dist[a.dist]);
}

// Closest and most central first; announce at most two.
function pickTop(items, n = 2) {
  const rank = { near: 0, medium: 1, far: 2 };
  return items.slice().sort((a, b) =>
    rank[a.dist] - rank[b.dist] || Math.abs(a.cx - 0.5) - Math.abs(b.cx - 0.5)
  ).slice(0, n);
}

function distanceM(a, b) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dp = toRad(b[0] - a[0]), dl = toRad(b[1] - a[1]);
  const h = Math.sin(dp / 2) ** 2 +
            Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const TA_TURN = {
  left: 'இடதுபுறம்', right: 'வலதுபுறம்',
  'slight left': 'சற்று இடதுபுறம்', 'slight right': 'சற்று வலதுபுறம்',
  'sharp left': 'கூர்மையாக இடதுபுறம்', 'sharp right': 'கூர்மையாக வலதுபுறம்'
};

function describeStep(step, lang) {
  const m = step.maneuver || {};
  const type = m.type || '', mod = m.modifier || '';
  const road = step.name || '';
  const ta = lang === 'ta';
  if (type === 'depart') return ta ? `${road || 'பாதை'} வழியாக நடக்கத் தொடங்குங்கள்` : `Start walking along ${road || 'the path'}`;
  if (type === 'arrive') return ta ? 'உங்கள் இடத்தை அடைந்துவிட்டீர்கள்' : 'You have arrived at your destination';
  if (mod === 'uturn') return ta ? 'திரும்பிச் செல்லுங்கள்' : 'Make a U-turn';
  if (TA_TURN[mod] || mod === 'left' || mod === 'right') {
    return ta ? `${road ? road + ' சாலையில் ' : ''}${TA_TURN[mod]} திரும்புங்கள்`
              : `Turn ${mod}${road ? ' onto ' + road : ''}`;
  }
  return ta ? `${road || 'பாதை'} வழியாக நேராகச் செல்லுங்கள்` : `Continue straight on ${road || 'the path'}`;
}

function stepSpeech(step, lang) {
  const text = describeStep(step, lang);
  if (step.distance < 10 || (step.maneuver && step.maneuver.type === 'arrive')) return text;
  const n = Math.max(10, Math.round(step.distance / 10) * 10);
  return lang === 'ta' ? `${text}, ${n} மீட்டர்` : `${text}, for ${n} metres`;
}

class Navigator {
  constructor(steps, radius = 20) {
    this.steps = steps; this.i = 0; this.radius = radius;
  }
  loc(i) { const [lon, lat] = this.steps[i].maneuver.location; return [lat, lon]; }
  first(lang) { return stepSpeech(this.steps[0], lang); }
  finished() { return this.i >= this.steps.length - 1; }
  // Returns text to speak when the walker reaches the next turn, else null.
  update(pos, lang) {
    if (this.finished()) return null;
    for (let j = this.i + 1; j <= Math.min(this.i + 2, this.steps.length - 1); j++) {
      if (distanceM(pos, this.loc(j)) < this.radius) {
        this.i = j;
        return stepSpeech(this.steps[j], lang);
      }
    }
    return null;
  }
  metresToNext(pos) {
    return this.finished() ? 0 : Math.round(distanceM(pos, this.loc(this.i + 1)));
  }
}

// ---- Danger alerts: track objects over time, detect approach / side entry ----
// Small table-top items never count as dangers.
const IGNORE = new Set(['bottle','cup','book','cell phone','laptop','remote','keyboard','mouse',
  'fork','knife','spoon','bowl','wine glass','scissors','toothbrush','vase','clock','tv']);

class Tracker {
  constructor() { this.tracks = []; this.nextId = 1; }
  update(items, now) {
    const free = this.tracks.slice();
    for (const it of items) {
      let best = null, bestD = 0.25;
      for (const t of free) {
        if (t.label !== it.label) continue;
        const l = t.hist[t.hist.length - 1];
        const d = Math.hypot(l.cx - it.cx, l.cy - it.cy);
        if (d < bestD) { best = t; bestD = d; }
      }
      const s = { t: now, cx: it.cx, cy: it.cy, size: it.size, m: it.m == null ? null : it.m };
      if (best) { free.splice(free.indexOf(best), 1); best.hist.push(s); best.seen = now; best.item = it; }
      else this.tracks.push({ id: this.nextId++, label: it.label, hist: [s], seen: now,
        enteredFrom: it.cx < 0.18 ? 'left' : (it.cx > 0.82 ? 'right' : null), alertedAt: 0, item: it });
    }
    for (const t of this.tracks) {
      while (t.hist.length && now - t.hist[0].t > 1500) t.hist.shift();
      t.m = median(t.hist.slice(-5).map(x => x.m));   // smoothed metres
    }
    this.tracks = this.tracks.filter(t => t.hist.length && now - t.seen < 700);
    return this.tracks;
  }
}

const avg = (a, k) => a.reduce((s, x) => s + x[k], 0) / a.length;

// Returns {level:'warn'|'stop', from:'left'|'right'|'ahead', label, tau, id} or null.
// tau = estimated seconds until it reaches you (object size / how fast its size grows).
function assess(t) {
  if (IGNORE.has(t.label) || t.hist.length < 5) return null;
  const h = t.hist;
  if ((h[h.length - 1].t - h[0].t) < 500) return null;
  const a = h.slice(0, 2), b = h.slice(-2);
  const dt = (avg(b, 't') - avg(a, 't')) / 1000;
  if (dt < 0.35) return null;
  const s0 = avg(a, 'size'), s1 = avg(b, 'size');
  const ratio = s1 / s0, grow = (s1 - s0) / dt;
  const vx = (avg(b, 'cx') - avg(a, 'cx')) / dt;   // frame-widths per second, + = moving right
  const cx = avg(b, 'cx');
  const tau = grow > 0.02 ? s1 / grow : Infinity;
  const horiz = cx < TH.leftMax ? 'left' : (cx > TH.rightMin ? 'right' : 'center');
  let from = null;
  if (s1 >= 0.15 && ratio > 1.05 && ((horiz === 'left' && vx > 0.08) || (horiz === 'right' && vx < -0.08))) from = horiz;
  else if (s1 >= 0.2 && t.enteredFrom && ((t.enteredFrom === 'left' && vx > 0.12) || (t.enteredFrom === 'right' && vx < -0.12))) from = t.enteredFrom;
  else if (s1 >= 0.2 && ratio > 1.1 && tau < 5 && cx > 0.2 && cx < 0.8) from = 'ahead';
  if (!from) return null;
  const stop = tau < 2 || (s1 >= 0.5 && ratio > 1.08);
  return { level: stop ? 'stop' : 'warn', from, label: t.label, tau, id: t.id };
}

function pickAlert(list) {
  if (!list.length) return null;
  return list.slice().sort((x, y) =>
    (x.level === 'stop' ? 0 : 1) - (y.level === 'stop' ? 0 : 1) || x.tau - y.tau)[0];
}

const AL = {
  en: { from: { left: 'from the left', right: 'from the right', ahead: 'ahead' },
        warn: (l, f) => `Warning! ${l} approaching ${f}`,
        stop: (l, f) => `Stop! ${l} very close, ${f}` },
  ta: { from: { left: 'இடதுபுறத்திலிருந்து', right: 'வலதுபுறத்திலிருந்து', ahead: 'முன்னால்' },
        warn: (l, f) => `எச்சரிக்கை! ${l} ${f} நெருங்குகிறது`,
        stop: (l, f) => `நிறுத்துங்கள்! ${l} மிக அருகில், ${f}` }
};
function alertText(al, lang) {
  const l = lang === 'ta' ? (TA_LABELS[al.label] || al.label) : al.label;
  return AL[lang][al.level](l, AL[lang].from[al.from]);
}

// ---- Stage 1: zones, metres, motion words, priority queue, visibility ----
function zone5(cx) {
  return cx < 0.2 ? 'far left' : cx < 0.4 ? 'left' : cx <= 0.6 ? 'ahead' : cx <= 0.8 ? 'right' : 'far right';
}
const ZONE_TEXT = { 'far left': 'far on your left', left: 'on your left', ahead: 'ahead',
                    right: 'on your right', 'far right': 'far on your right' };

// Real heights (metres) for the known-size distance method.
const REAL_H = { person: 1.7, car: 1.5, bus: 3.0, truck: 3.0, bicycle: 1.0, motorcycle: 1.2,
  chair: 0.9, couch: 0.85, bench: 0.85, dog: 0.5, 'dining table': 0.75, refrigerator: 1.7,
  'stop sign': 0.75, 'fire hydrant': 0.7 };
// focal is in frame-heights (1.0 ~ 53 degree vertical field of view); height = camera above ground.
const CAM = { focal: 1.0, height: 1.2, tiltDeg: 0 };

function median(arr) {
  const s = arr.filter(x => x != null).sort((a, b) => a - b);
  if (!s.length) return null;
  const n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
// Main method: distance = real height x focal / box height. Unreliable when the box is cut by the frame edge.
function knownSizeDist(a, cam) {
  const H = REAL_H[a.label];
  if (!H || a.truncated || a.hN < 0.04) return null;
  return Math.min(30, H * cam.focal / a.hN);
}
// Backup: where the object touches the floor, with camera height and tilt.
function groundDist(a, cam) {
  if (a.bottomN >= 0.98) return null;
  const ang = Math.atan((a.bottomN - 0.5) / cam.focal) + cam.tiltDeg * Math.PI / 180;
  if (ang < 0.03) return null;
  return Math.min(30, cam.height / Math.tan(ang));
}
function fuseDist(a, cam) {
  const k = knownSizeDist(a, cam), g = groundDist(a, cam);
  if (k != null && g != null) {
    const r = Math.max(k, g) / Math.min(k, g);
    return r <= 1.4 ? { m: 0.6 * k + 0.4 * g, src: 'both', ok: true } : { m: k, src: 'size', ok: false };
  }
  if (k != null) return { m: k, src: 'size', ok: true };
  if (g != null) return { m: g, src: 'ground', ok: true };
  return null;
}
// Stand a whole person at a known distance, press Calibrate: returns the focal length for this phone.
function calibrateFocal(label, metres, a) {
  const H = REAL_H[label];
  if (!H || a.truncated || a.hN < 0.1) return null;
  return Math.max(0.4, Math.min(2.5, metres * a.hN / H));
}
function metresText(m) {
  if (m == null) return null;
  if (m < 1) return 'less than 1 metre';
  if (m < 3) { const r = Math.round(m * 2) / 2; return r === 1 ? '1 metre' : `${r} metres`; }
  if (m < 6) return `${Math.round(m)} metres`;
  return 'far away';
}

// ---- Motion words with ego-motion fix ----
const STATIC_CLASSES = new Set(['bench','chair','couch','potted plant','dining table','bed','toilet',
  'refrigerator','traffic light','stop sign','fire hydrant','parking meter','tv']);
function isWalking(mags) {            // accelerometer magnitudes (m/s2) from the last ~1.5 s
  if (mags.length < 10) return false;
  const mean = mags.reduce((s, x) => s + x, 0) / mags.length;
  const sd = Math.sqrt(mags.reduce((s, x) => s + (x - mean) ** 2, 0) / mags.length);
  return sd > 0.9;
}
// Static classes are never "approaching". For movers, the user's own walking speed is subtracted.
function motionOf(t, walking, userSpeed = 1.2) {
  if (STATIC_CLASSES.has(t.label)) return { state: 'static' };
  const h = t.hist.filter(s => s.m != null);
  if (h.length < 5 || (h[h.length - 1].t - h[0].t) < 800) return null;
  const a = h.slice(0, 3), b = h.slice(-3);
  const dt = (avg(b, 't') - avg(a, 't')) / 1000;
  if (dt < 0.4) return null;
  const net = (avg(a, 'm') - avg(b, 'm')) / dt - (walking ? userSpeed : 0);
  const vx = (avg(b, 'cx') - avg(a, 'cx')) / dt;
  if (net > 0.4) return { state: 'approaching', net };
  if (net < -0.5) return { state: 'moving away', net };
  if (Math.abs(vx) > 0.15) return { state: 'crossing', dir: vx > 0 ? 'left to right' : 'right to left', net };
  return { state: 'standing', net };
}

  if (st === 'crossing') return `${a.label} crossing ${motion.dir}, ${dist}`;

// ---- Priority queue: 0 danger, 1 approach/side/back/visibility, 2 navigation, 3 normal ----
class PriorityQueue {
  constructor() { this.items = []; this.lastSaid = new Map(); }
  enqueue(msg, now) {
    const cd = msg.cooldown || 0;
    if (cd && now - (this.lastSaid.has(msg.key) ? this.lastSaid.get(msg.key) : -1e9) < cd) return false;
    const ttl = msg.ttl == null ? 3000 : msg.ttl;
    const dup = this.items.find(i => i.key === msg.key);
    if (dup) { dup.text = msg.text; dup.priority = Math.min(dup.priority, msg.priority); dup.t = now; dup.ttl = ttl; return true; }
    this.items.push({ text: msg.text, priority: msg.priority, key: msg.key, t: now, ttl });
    return true;
  }
  live(now) {
    this.items = this.items.filter(i => now - i.t <= i.ttl);
    return this.items.slice().sort((a, b) => a.priority - b.priority || a.t - b.t);
  }
  peek(now) { return this.live(now)[0] || null; }
  next(now) {
    const top = this.peek(now);
    if (!top) return null;
    this.items.splice(this.items.indexOf(top), 1);
    this.lastSaid.set(top.key, now);
    return top;
  }
}

// ---- Visibility: is the camera dark, blocked or blurry? (input: grey pixels of a small frame) ----
function greyStats(rgba, w, h) {
  const g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = 0.299 * rgba[4 * i] + 0.587 * rgba[4 * i + 1] + 0.114 * rgba[4 * i + 2];
  let mean = 0; for (const v of g) mean += v; mean /= g.length;
  let sd = 0; for (const v of g) sd += (v - mean) ** 2; sd = Math.sqrt(sd / g.length);
  let sharp = 0, n = 0;
  for (let y = 0; y < h; y++) for (let x = 1; x < w; x++) { sharp += Math.abs(g[y * w + x] - g[y * w + x - 1]); n++; }
  return { mean, std: sd, sharp: sharp / n };
}

  if (s.std < 9) return 'blocked';

}

}

  if (/\b(yes|yeah|yep|yup|ok|okay|sure|correct|start|go ahead|right|confirm)\b/.test(s)) return 'yes';

}

}

function beep(pan, level) {
  if (!audioCtx) return;
  const n = level === 'stop' ? 3 : 1;
  for (let i = 0; i < n; i++) {
    const t0 = audioCtx.currentTime + i * 0.16;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), p = audioCtx.createStereoPanner();
    o.frequency.value = level === 'stop' ? 1200 : 880;
    p.pan.value = pan;                        // -1 = left ear, +1 = right ear
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g).connect(p).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.14);
  }
}

  if (!speaking) curPriority = 9;
  const top = pq.peek(now);

  if (speaking && !(top.priority < curPriority && top.priority <= 1)) return;
  if (top.priority >= 3 && Date.now() < holdUntil) return;

function drawBoxes(items) {
  const W = video.videoWidth, H = video.videoHeight;
  if (overlay.width !== W) { overlay.width = W; overlay.height = H; }
  ctx.clearRect(0, 0, W, H);
  const fs = Math.max(14, Math.round(W / 28));
  ctx.font = `600 ${fs}px system-ui, sans-serif`;
  ctx.lineWidth = Math.max(2, W / 200);
  for (const p of items) {
    const [x, y, w, h] = p.bbox;
    ctx.strokeStyle = '#ffd23f';
    ctx.strokeRect(x, y, w, h);
    const t = `${p.label} ${p.m != null ? p.m.toFixed(1) + ' m' : Math.round(p.score * 100) + '%'}`;
    const tw = ctx.measureText(t).width + 8;
    const lx = Math.max(0, Math.min(x, W - tw));
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(lx, Math.max(0, y - fs - 4), tw, fs + 4);
    ctx.fillStyle = '#14110a';
    ctx.fillText(t, lx + 4, Math.max(fs, y - 6));
  }
}

function onMotion(e) {

  if (!a) return;

  accelBuf.push({ t, m: Math.hypot(a.x || 0, a.y || 0, a.z || 0) });

async function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.videoWidth) {
    let preds = [];
    try { preds = await model.detect(video, 10, 0.5); } catch (e) { /* skip frame */ }
    const W = video.videoWidth, H = video.videoHeight;
    tiltDeg = currentTilt(); CAM.tiltDeg = tiltDeg;
    walking = isWalking(accelBuf.map(x => x.m));
    const raw = preds.map(p => analyze(p, W, H, CAM));
    const now = performance.now();
    const tracks = tracker.update(raw, now);
    // each object now carries smoothed metres and what it is doing
    const items = tracks.filter(t => t.seen === now).map(t =>
      ({ ...t.item, m: t.m != null ? t.m : t.item.m, motion: motionOf(t, walking) }));
    lastItems = items;
    drawBoxes(items);
    updateRadar(items);
    visTick(now);
    let fired = false;
    if (alertsOn) {
      const cands = [];
      for (const t of tracks) {
        const al = assess(t);
        // repeat after 2.5 s, but an escalation from warning to stop is never held back
        if (al && (now - t.alertedAt > 2500 || (al.level === 'stop' && t.alertedLevel !== 'stop'))) cands.push(al);
      }
      const al = pickAlert(cands);
      if (al && now - lastAlertAt > 600) {
        const t = tracks.find(t => t.id === al.id);
        t.alertedAt = now; t.alertedLevel = al.level;
        lastAlertAt = now; danger(al); fired = true;

    if (items.length) announce(items);
    const t = Date.now();
    if (t - lastLog > 1000 && items.length && logRows.length < 5000) {
      lastLog = t;
      for (const a of items) logRows.push([new Date(t).toISOString(), a.label, a.score.toFixed(2), a.zone, a.dist,
        a.m != null ? a.m.toFixed(2) : '', a.motion ? a.motion.state : '']);

    if (el >= 2) { $('fps').textContent = `${(frames / el).toFixed(1)} FPS`; frames = 0; fpsStart = performance.now();
      $('dbg').textContent = `walk:${walking ? 'yes' : 'no'} tilt:${Math.round(tiltDeg)}° f:${CAM.focal.toFixed(2)}`; }

// ---------- Navigation (free OpenStreetMap services) ----------
function getPosition() {
  return new Promise((res, rej) =>
    navigator.geolocation.getCurrentPosition(
      p => res([p.coords.latitude, p.coords.longitude]), rej,
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }));
}

async function geocode(q, near) {
  const d = 0.4; // bias results to ~40 km around the user
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1' +
    `&viewbox=${near[1] - d},${near[0] + d},${near[1] + d},${near[0] - d}&q=${encodeURIComponent(q)}`;
  const data = await (await fetch(url)).json();
  if (!data.length) throw new Error('Destination not found');
  const out = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  out.name = data[0].display_name;
  return out;
}

async function getRoute(a, b) {
  const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${a[1]},${a[0]};${b[1]},${b[0]}?steps=true&overview=false`;
  const data = await (await fetch(url)).json();
  if (data.code !== 'Ok') throw new Error('No walking route found');
  return data.routes[0].legs.flatMap(l => l.steps);
}

function stopNav() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; nav = null;
  $('stopNavBtn').hidden = true; $('goBtn').hidden = false;
}

function beginNav(steps, label) {
  nav = new Navigator(steps);
  $('goBtn').hidden = true; $('stopNavBtn').hidden = false;
  navStatus.textContent = 'Navigating to ' + label;
  queueSay(nav.first(lang), 2, 'nav', { ttl: 10000 });
  watchId = navigator.geolocation.watchPosition(p => {
    if (!nav) return;
    lastPos = [p.coords.latitude, p.coords.longitude];
    const msg = nav.update(lastPos, lang);
    if (msg) {
      queueSay(msg, 2, 'nav', { ttl: 10000 });
      if (nav.finished()) stopNav();
    }
    if (nav) navStatus.textContent = `Next turn in ${nav.metresToNext(lastPos)} m (GPS ±${Math.round(p.coords.accuracy)} m)`;
  }, () => { navStatus.textContent = 'Lost GPS signal.'; },
  { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}

$('navForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('dest').value.trim();
  if (!q) return;
  try {
    navStatus.textContent = 'Finding your location…';
    const here = await getPosition();
    navStatus.textContent = 'Finding destination…';
    const to = await geocode(q, here);
    navStatus.textContent = 'Planning walking route…';
    beginNav(await getRoute(here, to), q);
  } catch (err) {
    navStatus.textContent = err && err.code === 1 ? 'Location permission denied.' : (err.message || 'Navigation failed.');
  }

function sayWait(text) {            // speak and resolve when finished

    if (!('speechSynthesis' in window)) return res();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN';

    r.onend = () => finish(null);
    const tm = setTimeout(() => finish(null), ms);
    try { r.start(); } catch (e) { finish(null); }
  });
}

async function listenWithBeep(ms) {
  $('voiceBtn').dataset.state = 'listening';
  beep(0, 'warn');
  const t = await listen(ms);
  $('voiceBtn').dataset.state = '';
  return t;
}

async function askYesNo(prompt) {
  for (let i = 0; i < 2; i++) {
    await sayWait(i ? 'Please say yes or no.' : prompt);
    const a = parseYesNo((await listenWithBeep(6000)) || '');
    if (a) return a;
  }
  return null;
}

async function voiceDestination() {
  if (dialog) return;
  dialog = true;
  try {
    if (!SR) { await sayWait('Voice input is not supported in this browser. Please use Chrome.'); return; }
    await sayWait(nav ? 'Navigation is on. Say stop to cancel, or say a new destination.' : 'Where do you want to go?');
    let heard = null;
    for (let i = 0; i < 2 && !heard; i++) {
      heard = await listenWithBeep(7000);
      if (!heard && i === 0) await sayWait('I did not hear you. Please say the place again.');
    }
    if (!heard) { await sayWait('Sorry, I could not hear a destination. Tap the button to try again.'); return; }
    navStatus.textContent = 'Heard: ' + heard;
    if (nav && /\b(stop|cancel)\b/i.test(heard)) { stopNav(); await sayWait('Navigation stopped.'); return; }
    const place = cleanDestination(heard) || heard;
    await sayWait(`Looking for ${place}.`);
    const here = await getPosition();
    const to = await geocode(place, here);
    const steps = await getRoute(here, to);
    const meters = steps.reduce((t, st) => t + st.distance, 0);
    const secs = steps.reduce((t, st) => t + (st.duration || 0), 0) || meters / 1.2;
    const ans = await askYesNo(`${shortName(to.name) || place}. ${distanceText(meters)}, about ${durationText(secs)} walking. Say yes to start, or no to cancel.`);
    if (ans === 'yes') { stopNav(); await sayWait('Starting navigation.'); beginNav(steps, shortName(to.name) || place); }
    else await sayWait(ans === 'no' ? 'Cancelled. Tap the button to choose another place.' : 'I did not understand. Cancelled.');
  } catch (err) {
    const msg = err && err.code === 1 ? 'Location permission is blocked. Please allow location.'
      : (err && err.message === 'Destination not found' ? 'I could not find that place. Tap the button and try again.'
      : 'Navigation failed. Please check your internet and try again.');
    navStatus.textContent = msg;
    await sayWait(msg);
  } finally { dialog = false; $('voiceBtn').dataset.state = ''; }
}
$('voiceBtn').addEventListener('click', voiceDestination);
$('stopNavBtn').addEventListener('click', () => { stopNav(); navStatus.textContent = 'Navigation stopped.'; });

// ---------- Log export ----------
$('csvBtn').addEventListener('click', () => {
  const csv = logRows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'smartvision_log.csv';
  document.body.appendChild(a); a.click(); a.remove();
});

if ('speechSynthesis' in window) speechSynthesis.getVoices();
